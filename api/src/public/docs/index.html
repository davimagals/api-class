<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentação da API</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px;
        color: #222;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        color: #666;
      }

      .docs-list {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .doc-card {
        display: block;
        text-decoration: none;
        background: #fafafa;
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 10px;
        transition: 0.2s;
        color: inherit;
      }

      .doc-card:hover {
        background: #f0f7ff;
        border-color: #2196f3;
      }

      .doc-title {
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .doc-description {
        color: #666;
        font-size: 0.95rem;
      }

      footer {
        margin-top: 40px;
        color: #888;
        font-size: 0.9rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Documentação da API</h1>

      <p>Lista de endpoints e recursos disponíveis na API.</p>

      <div class="docs-list">
        <a class="doc-card" href="/docs/multas/motoristas.html">
          <div class="doc-title">Motoristas</div>

          <div class="doc-description">
            Endpoints de cadastro, atualização e consulta de motoristas.
          </div>
        </a>
      </div>

      <footer>API Class</footer>
    </div>
  </body>
</html>
