services:
  api:
    build: ./api
    container_name: api_class
    restart: always
    ports:
      - "${PORT}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    depends_on:
      - mysql
    volumes:
      - ./api/public/uploads:/app/public/uploads

  mysql:
    image: mysql:8.0
    container_name: api_class_mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
